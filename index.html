<body>

<header class="topbar">
  <button class="icon-btn only-mobile" id="btnMenu" aria-label="目录">☰</button>
  <button class="icon-btn only-mobile" id="btnTocSheet" aria-label="本页目录" title="本页目录">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h12M4 12h9M4 17h6"/><path d="M17.5 16.5 20 19l-2.5 2.5" opacity=".55"/></svg>
  </button>

  <a class="brand" href="#/home">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <path d="M12 2.6 20.4 7.3v9.4L12 21.4 3.6 16.7V7.3z"/>
        <path d="M12 7.6 16.6 10v4.2L12 16.6 7.4 14.2V10z"/>
      </svg>
    </span>
    <span class="brand-text"><b>PyTorch</b><i id="brandSub">学习站</i></span>
  </a>

  <button class="search-trigger" id="btnSearch">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <span id="searchLabel">搜索章节 / 概念 / 代码</span>
    <kbd>Ctrl K</kbd>
  </button>

  <div class="top-actions">
    <div class="seg" id="langSeg" role="group" aria-label="语言">
      <button data-lang="zh" class="on">中文</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="ghost-btn" id="btnNotes">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M8.5 13h7M8.5 16.5h4.5"/></svg>
      <span id="notesLabel">笔记</span>
    </button>
    <button class="icon-btn" id="btnPrefs" aria-label="显示设置" title="显示设置">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.11A1.7 1.7 0 0 0 20.86 10H21a2 2 0 1 1 0 4h-.11A1.7 1.7 0 0 0 19.4 15z"/></svg>
    </button>
    <div class="chip" id="progressChip" title="学习进度">0 / 0</div>
  </div>

  <!-- 显示设置弹层 -->
  <div class="pref-panel" id="prefPanel" hidden>
    <div class="pref-row">
      <span class="pref-k" id="prefThemeLabel">外观</span>
      <div class="seg sm" id="prefTheme">
        <button data-theme="light" class="on">浅色</button>
        <button data-theme="dark">深色</button>
      </div>
    </div>
    <div class="pref-row">
      <span class="pref-k" id="prefFontLabel">字号</span>
      <div class="seg sm" id="prefFont">
        <button data-font="sm">小</button>
        <button data-font="md" class="on">中</button>
        <button data-font="lg">大</button>
      </div>
    </div>
    <div class="pref-row">
      <span class="pref-k" id="prefModeLabel">阅读</span>
      <div class="seg sm" id="prefMode">
        <button data-mode="beginner" class="on">新手</button>
        <button data-mode="advanced">进阶</button>
      </div>
    </div>
    <div class="pref-row">
      <span class="pref-k" id="prefDataLabel">学习数据</span>
      <div class="pref-btns">
        <button class="ghost-btn sm" id="btnExportData">导出</button>
        <button class="ghost-btn sm" id="btnImportData">导入</button>
      </div>
    </div>
    <p class="pref-hint" id="prefHint">进阶模式会隐藏「零基础批注」，只看正文与代码</p>
    <p class="pref-hint" id="prefDataHint">导出成 JSON 可换设备 / 换浏览器继续学</p>
    <input type="file" id="fileImport" accept="application/json,.json" hidden />
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="章节目录"></aside>
  <main class="main">
    <article class="article" id="content"></article>
    <footer class="site-foot">
      <span id="footNote">PyTorch 学习站 · 本地运行，数据只保存在你的浏览器里</span>
      <span id="footDisc" class="foot-disc">本站为个人学习项目，与 PyTorch 官方及 Meta 无关；内容仅供学习参考，不构成任何专业建议。</span>
    </footer>
  </main>
  <aside class="toc" id="toc" aria-label="本页目录"></aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- 搜索面板 -->
<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-panel">
    <div class="search-head">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索…" aria-label="搜索章节、概念或代码" role="searchbox" />
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-foot" id="searchFoot"></div>
  </div>
</div>

<!-- 笔记抽屉 -->
<aside class="drawer" id="noteDrawer" aria-label="笔记">
  <div class="drawer-head">
    <div>
      <h3 id="noteTitle">笔记</h3>
      <p id="noteSub" class="muted">仅保存在本机浏览器</p>
    </div>
    <button class="icon-btn" id="btnCloseNote" aria-label="关闭">✕</button>
  </div>
  <textarea id="noteArea" spellcheck="false" placeholder="在这里记录你的理解、疑问、代码片段…"></textarea>
  <div class="drawer-foot">
    <span id="noteStatus" class="muted"></span>
    <div class="row">
      <button class="ghost-btn sm" id="btnExportNotes">导出 .md</button>
      <button class="ghost-btn sm danger" id="btnClearNote">清空本章</button>
    </div>
  </div>
</aside>

<!-- 划词工具栏 -->
<div class="sel-toolbar" id="selToolbar" hidden>
  <button data-mark="hl-yellow" title="高亮"><i class="sw sw-y"></i></button>
  <button data-mark="hl-green" title="绿色标记"><i class="sw sw-g"></i></button>
  <button data-mark="hl-red" title="重点标记（红）"><i class="sw sw-r"></i></button>
  <span class="sep"></span>
  <button data-act="note" title="把选中的内容摘录到笔记" class="txt">✎</button>
  <button data-act="ask" title="把选中的内容作为疑问记下来" class="txt">?</button>
  <span class="sep"></span>
  <button data-mark="hl-underline" title="下划线" class="txt">U</button>
  <button data-mark="clear" title="取消标记" class="txt">✕</button>
</div>

<!-- 悬浮速查表 -->
<button class="fab" id="fabCheat" title="速查表（A 键）" aria-label="速查表">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M11 4h7.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H11"/><path d="M7 8h1.5M7 11h1.5M14 8h3M14 11h3"/></svg>
</button>
<div class="cheat-panel" id="cheatPanel" hidden>
  <div class="cheat-head">
    <b id="cheatTitle">API 速查</b>
    <button class="icon-btn sm" id="btnCheatClose" aria-label="关闭">✕</button>
  </div>
  <div class="cheat-body" id="cheatBody"></div>
  <div class="cheat-foot"><a href="#/ch99" id="cheatMore">完整速查表 →</a></div>
</div>
